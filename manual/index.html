  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

laceholder-val=\"{{ true }}\">\n            <p style=\"font-size:16.5px; line-height:1.62; margin:0 0 16px;\">{{ b.text }}<\u002Fp>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ b.isKey }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:{{ t.accentSoft }}; border-radius:{{ t.rKey }}; padding:16px 18px; margin:0 0 16px;\">\n              <div style=\"font-size:11px; font-weight:700; letter-spacing:.14em; color:{{ t.accent }}; margin-bottom:6px;\">CLAVE<\u002Fdiv>\n              <div style=\"font-size:16.5px; font-weight:600; line-height:1.5;\">{{ b.text }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ b.isQuote }}\" hint-placeholder-val=\"{{ false }}\">\n            <figure style=\"margin:0 0 16px; border-left:4px solid {{ t.ter }}; border-radius:2px 0 0 3px; padding:4px 0 4px 16px;\">\n              <blockquote style=\"margin:0; font-size:16.5px; font-style:italic; line-height:1.55;\">{{ b.text }}<\u002Fblockquote>\n              <figcaption style=\"margin-top:8px; font-size:13px; font-weight:600; color:{{ t.mut }};\">{{ b.src }}<\u002Ffigcaption>\n            <\u002Ffigure>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ b.isList }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex; flex-direction:column; gap:11px; margin:2px 0 18px;\">\n              <sc-for list=\"{{ b.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex; gap:12px; align-items:flex-start;\">\n                  <div style=\"flex:none; width:8px; height:8px; border-radius:50%; background:{{ t.accent }}; margin-top:8px;\"><\u002Fdiv>\n                  <div style=\"font-size:16px; line-height:1.55;\">{{ it }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"position:sticky; bottom:0; padding:14px 0 24px; background:linear-gradient(to top, {{ t.bg }} 72%, transparent);\">\n      <div style=\"display:flex; gap:10px;\">\n        <button onclick=\"{{ onPrev }}\" style=\"flex:none; height:52px; padding:0 22px; border-radius:{{ t.rBtn }}; border:1px solid {{ t.line }}; background:{{ t.surface }}; color:{{ t.ink }}; font-family:'Instrument Sans',sans-serif; font-size:15px; font-weight:600; cursor:pointer; opacity:{{ prevOpacity }};\">Anterior<\u002Fbutton>\n        <button onclick=\"{{ onNext }}\" style=\"flex:1; height:52px; border-radius:{{ t.rBtn }}; border:0; background:{{ t.accent }}; color:{{ t.onAccent }}; font-family:'Instrument Sans',sans-serif; font-size:16px; font-weight:700; cursor:pointer; transition:transform .15s ease, filter .2s ease;\" style-hover=\"filter:brightness(1.07)\" style-active=\"transform:scale(.985)\">{{ nextLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ================= INSIGNIA ================= -->\n  <sc-if value=\"{{ isBadge }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"Insignia\" style=\"min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 8px; gap:6px;\">\n    <div style=\"position:relative; width:150px; height:150px; animation:pop .5s cubic-bezier(.2,1.4,.4,1) both;\">\n      <svg width=\"150\" height=\"150\" viewBox=\"0 0 150 150\" style=\"display:block;\">\n        <circle cx=\"75\" cy=\"75\" r=\"70\" fill=\"{{ t.accentSoft }}\"><\u002Fcircle>\n        <circle cx=\"75\" cy=\"75\" r=\"54\" fill=\"{{ t.accent }}\"><\u002Fcircle>\n        <circle cx=\"75\" cy=\"75\" r=\"61\" fill=\"none\" stroke=\"{{ t.accent }}\" stroke-width=\"2\" stroke-dasharray=\"4 7\" stroke-linecap=\"round\"><\u002Fcircle>\n      <\u002Fsvg>\n      <div style=\"position:absolute; inset:0; display:grid; place-items:center; font-family:'Averia Serif Libre',serif; font-size:40px; font-weight:800; color:{{ t.onAccent }};\">{{ badgeNum }}<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size:11px; font-weight:700; letter-spacing:.16em; color:{{ t.accent }}; margin-top:22px;\">INSIGNIA TIERRA FIRME<\u002Fdiv>\n    <h2 style=\"font-family:'Averia Serif Libre',serif; font-weight:800; font-size:26px; letter-spacing:-.012em; margin:4px 0 2px;\">{{ badgeTitle }}<\u002Fh2>\n    <p style=\"font-size:15.5px; color:{{ t.mut }}; margin:0 0 26px; max-width:30em;\">{{ badgeSub }}<\u002Fp>\n    <button onclick=\"{{ onBack }}\" style=\"height:52px; padding:0 34px; border-radius:{{ t.rBtn }}; border:0; background:{{ t.accent }}; color:{{ t.onAccent }}; font-family:'Instrument Sans',sans-serif; font-size:16px; font-weight:700; cursor:pointer;\" style-hover=\"filter:brightness(1.07)\">Seguir con el manual<\u002Fbutton>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;: {&quot;width&quot;: 430, &quot;height&quot;: 900}, &quot;direccion&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;Cívico (original)&quot;, &quot;Bosque&quot;, &quot;Mono&quot;, &quot;Nocturno&quot;, &quot;Coral&quot;], &quot;default&quot;: &quot;Cívico (original)&quot;, &quot;section&quot;: &quot;Apariencia&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;gamificacion&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;section&quot;: &quot;Apariencia&quot;, &quot;tsType&quot;: &quot;boolean&quot;}}\">\nconst STORE_KEY = \"tf-manual-accion-app-v1\";\nconst RING_C = 163.4;\n\nconst GRAIN = 'url(\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScyNjAnIGhlaWdodD0nMjYwJz48ZmlsdGVyIGlkPSduJz48ZmVUdXJidWxlbmNlIHR5cGU9J2ZyYWN0YWxOb2lzZScgYmFzZUZyZXF1ZW5jeT0nMC44NScgbnVtT2N0YXZlcz0nMicvPjxmZUNvbG9yTWF0cml4IHZhbHVlcz0nMCAwIDAgMCAwLjMgMCAwIDAgMCAwLjI3IDAgMCAwIDAgMC4xOCAwIDAgMCAwLjA1IDAnLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0nMjYwJyBoZWlnaHQ9JzI2MCcgZmlsdGVyPSd1cmwoI24pJy8+PC9zdmc+\")';\nconst ORGANIC = { rBtn:\"26px 22px 25px 23px / 23px 26px 22px 26px\", rMed:\"46% 54% 52% 48% / 52% 48% 54% 46%\", rKey:\"18px 14px 20px 15px\", grain:true };\n\nconst THEMES = {\n  civico:   { bg:\"#F7F5EC\", surface:\"#FFFDF4\", ink:\"#2A2A20\", mut:\"#77725D\", line:\"#E3DDC6\", accent:\"#2E7D4F\", onAccent:\"#FFFDF4\", accentSoft:\"#E0EBDD\", warn:\"#D29A18\", r:\"22px 18px 24px 19px\",\n              ter:\"#D96C4A\", terSoft:\"#F5E1D6\", och:\"#D29A18\", ochSoft:\"#F2E6C6\", paper:true },\n  nocturno: { bg:\"#0F1417\", surface:\"#1A2126\", ink:\"#EDF2F1\", mut:\"#8FA09E\", line:\"#28323A\", accent:\"#FFC94A\", onAccent:\"#241A00\", accentSoft:\"#2C2A1D\", warn:\"#4CC38A\", r:\"20px\" },\n  coral:    { bg:\"#F7F5EC\", surface:\"#FFFFFF\", ink:\"#241812\", mut:\"#7C6A5F\", line:\"#EBDFD3\", accent:\"#D96C4A\", onAccent:\"#FFFFFF\", accentSoft:\"#F8E4DB\", warn:\"#2E7D4F\", r:\"20px\" },\n  bosque:   { bg:\"#22392C\", surface:\"#2C4837\", ink:\"#F1EDDE\", mut:\"#9FB0A0\", line:\"#3C5847\", accent:\"#E4A63C\", onAccent:\"#2A2008\", accentSoft:\"#3A5142\", warn:\"#DF7A55\", ter:\"#DF7A55\", r:\"22px 18px 24px 19px\" },\n  mono:     { bg:\"#F5F5F3\", surface:\"#FFFFFF\", ink:\"#191A17\", mut:\"#6C6D67\", line:\"#E3E4DE\", accent:\"#0B8A47\", onAccent:\"#FFFFFF\", accentSoft:\"#E1F3E8\", warn:\"#C98A0B\", ter:\"#0B8A47\", r:\"16px\",\n              rBtn:\"999px\", rMed:\"14px\", rKey:\"14px\", grain:false }\n};\n\nconst MODULES = [\n  { id:\"ahora\", num:\"1\", title:\"Dónde estamos ahora\", sub:\"La emergencia sigue abierta y el trabajo se amplió.\", lessons:[\n    { title:\"La búsqueda sigue viva\", blocks:[\n      { t:\"p\", text:\"Todavía se encuentra gente con vida bajo los escombros, incluso más de una semana después del sismo. Donde haya señales de vida, el rescate sigue siendo la prioridad.\" },\n      { t:\"key\", text:\"No des a nadie por perdido antes de tiempo.\" },\n      { t:\"p\", text:\"Quienes escarban necesitan manos, agua, baldes y herramientas. Si no estás en el rescate, puedes sostener a los que sí están.\" } ] },\n    { title:\"Dos frentes a la vez\", blocks:[\n      { t:\"p\", text:\"Mientras unos siguen en la búsqueda, crecen las necesidades de los que ya salieron: agua limpia, comida, techo, salud, acompañamiento.\" },\n      { t:\"key\", text:\"No cambies un frente por el otro. Reparte a los grupos para sostener los dos al mismo tiempo.\" } ] },\n    { title:\"Sostén el punto aunque baje la gente\", blocks:[\n      { t:\"p\", text:\"Las cámaras se van yendo y con ellas parte de los voluntarios, pero las necesidades siguen ahí.\" },\n      { t:\"p\", text:\"Mantén el punto de coordinación abierto con horarios claros, para que la respuesta no se apague justo cuando más falta hace.\" } ] },\n    { title:\"Cuida a quien lleva días encima\", blocks:[\n      { t:\"p\", text:\"A esta altura el agotamiento es un riesgo enorme, sobre todo para quienes llevan días escarbando. Rota a la gente y obliga los descansos.\" },\n      { t:\"list\", items:[\"Se desconectan o andan embotados.\",\"Cargan un mal humor que antes no tenían.\",\"Sienten que nada de lo que hacen alcanza.\"] },\n      { t:\"p\", text:\"Si ves estas señales en alguien, dale relevo hoy, no mañana.\" } ] },\n    { title:\"Vuelve a buscar a quien quedó fuera\", blocks:[\n      { t:\"p\", text:\"En los primeros días la ayuda corrió por las redes de siempre. Date ahora el tiempo de buscar a los que nadie contó.\" },\n      { t:\"list\", items:[\"Ancianos que viven solos.\",\"Personas con discapacidad.\",\"Hogares aislados o sin quién los defienda.\"] },\n      { t:\"key\", text:\"Ve tú a ellos. La ayuda no fluye sola hacia los desconectados.\" } ] },\n    { title:\"Anota lo que viene, sin soltar lo urgente\", blocks:[\n      { t:\"p\", text:\"Junto a lo de hoy empiezan a asomar necesidades que van a durar: servicios, papeles perdidos, viviendas por revisar, la escuela de los niños.\" },\n      { t:\"p\", text:\"Anótalas desde ya. Esos registros son los que sostienen la recuperación y cualquier ayuda que llegue después.\" } ] } ] },\n\n  { id:\"punto\", num:\"2\", title:\"El punto de coordinación\", sub:\"Un lugar visible donde la gente se registra y recibe tarea.\", lessons:[\n    { title:\"Qué es y qué no es\", blocks:[\n      { t:\"p\", text:\"No es un jefe ni una oficina. Es un lugar fijo y visible donde la gente se registra, recibe una tarea y deja información antes de salir.\" },\n      { t:\"p\", text:\"Su trabajo es conectar a los grupos entre sí y con cualquier actor formal que aparezca, sea Protección Civil, Cruz Roja, una iglesia o la universidad. Conectar, no absorber: cada grupo mantiene su iniciativa.\" } ] },\n    { title:\"La regla de oro\", blocks:[\n      { t:\"key\", text:\"Sin registro no hay asignación.\" },\n      { t:\"p\", text:\"Quien quiere ayudar pasa primero por el registro. Así nadie trabaja sin conocer el riesgo del día, y queda constancia de quién estuvo, dónde y haciendo qué.\" },\n      { t:\"p\", text:\"Anotar no es burocracia: es lo que permite pasar el turno, pedir lo que falta y no repetir esfuerzos.\" } ] },\n    { title:\"Qué necesita el punto\", blocks:[\n      { t:\"list\", items:[\n        \"Un lugar visible y seguro, lejos de estructuras que puedan caer.\",\n        \"Una lista de registro con nombre, contacto, qué sabe hacer cada quien y la hora en que entró.\",\n        \"Algo para marcar a quien ya se registró: un chaleco, una cinta en el brazo, lo que haya a mano.\",\n        \"Una pared o pizarra con lo que se necesita ahora mismo, cada cosa con su fecha y hora.\",\n        \"Una persona fija recibiendo, para que nadie ande suelto sin tarea ni se vaya sin avisar.\"] } ] } ] },\n\n  { id:\"grupos\", num:\"3\", title:\"Grupos de acción\", sub:\"El trabajo se reparte en grupos con funciones claras.\", lessons:[\n    { title:\"Cómo se reparte el trabajo\", blocks:[\n      { t:\"p\", text:\"La respuesta se reparte en grupos de acción, cada uno con una función clara y autonomía para trabajar. El punto de coordinación solo los enlaza.\" },\n      { t:\"p\", text:\"Unos trabajan en el terreno y otros en la base. Cada grupo anota lo suyo: eso es lo que permite pasar el turno, pedir lo que falta y no repetir esfuerzos.\" } ] },\n    { title:\"Grupos de terreno\", blocks:[\n      { t:\"list\", items:[\n        \"Rescate y remoción: sacan personas y despejan donde es seguro entrar. Anotan dónde trabajaron, cuántos salieron y qué riesgos vieron.\",\n        \"Salud y primeros auxilios: estabilizan heridos y los derivan. Anotan gravedad, a dónde fue cada uno y qué medicinas se acaban.\",\n        \"Cocina: preparan comida caliente. Anotan raciones diarias, qué ingredientes faltan y si hay con qué refrigerar.\",\n        \"Refugio y albergue: sostienen espacios seguros para dormir. Anotan cuántos alojados, la capacidad real y quiénes son los más vulnerables.\"] } ] },\n    { title:\"Grupos de base\", blocks:[\n      { t:\"list\", items:[\n        \"Provisión y acopio: reciben y reparten lo no perecedero. Anotan qué entró, qué salió, existencias y vencimientos.\",\n        \"Transporte y logística: mueven gente y carga. Anotan vehículos, capacidad, rutas y combustible.\",\n        \"Registro y coordinación: registran voluntarios y asignan tareas. Anotan contacto, habilidades y horas de cada quien.\",\n        \"Mapeo e información: recogen reportes y los ubican. Anotan qué se necesita y dónde, con fecha y hora en cada dato.\",\n        \"Apoyo y cuidado: cuidan a voluntarios y familias. Anotan turnos, descansos y quién necesita relevo.\"] } ] } ] },\n\n  { id:\"reglas\", num:\"4\", title:\"Reglas que no se negocian\", sub:\"La seguridad del voluntario va antes que la prisa.\", lessons:[\n    { title:\"Por qué van primero\", blocks:[\n      { t:\"p\", text:\"Un voluntario herido deja de ayudar y pasa a necesitar ayuda. Estas reglas están antes que cualquier urgencia.\" },\n      { t:\"key\", text:\"La seguridad del voluntario va primero. Nadie entra a una tarea que lo supera.\" } ] },\n    { title:\"Antes de salir\", blocks:[\n      { t:\"list\", items:[\n        \"Charla corta antes de cada salida: qué peligros hay hoy. Réplicas, cables, agua contaminada, calor, estructuras que ceden.\",\n        \"Nadie trabaja solo, y nadie sale de noche sin avisar dónde va y con quién.\",\n        \"Las tareas que piden entrenamiento, como rescate en estructuras o atención médica seria, son para quien está entrenado. El resto del trabajo es para todos.\"] } ] },\n    { title:\"Los límites\", blocks:[\n      { t:\"list\", items:[\n        \"Hay lugares donde los voluntarios no entran: riesgo alto de derrumbe, materiales peligrosos, escenas que exceden a cualquiera sin equipo.\",\n        \"El agotamiento también lastima. Turnos, descansos, agua y comida son parte del trabajo, no un lujo.\"] } ] } ] },\n\n  { id:\"sipasa\", num:\"5\", title:\"Qué hacer si…\", sub:\"Cuatro situaciones que casi siempre aparecen.\", lessons:[\n    { title:\"Si aparece el Estado o una organización grande\", blocks:[\n      { t:\"p\", text:\"No se disuelvan. Ya tienen la zona mapeada y a la gente organizada, y eso vale.\" },\n      { t:\"p\", text:\"Ofrezcan lo que saben y negocien un lugar en la coordinación, en vez de entregar todo y desaparecer.\" } ] },\n    { title:\"Si llegan donaciones que nadie pidió\", blocks:[\n      { t:\"p\", text:\"Sepárenlas del resto y digan en voz alta qué se necesita y qué no.\" },\n      { t:\"p\", text:\"La ropa vieja y las cosas que nadie usa tapan las vías y roban tiempo que hace falta para lo urgente.\" } ] },\n    { title:\"Si el riesgo pide especialistas\", blocks:[\n      { t:\"p\", text:\"Colapsos grandes, químicos, fuego. Ahí los voluntarios se retiran y llaman a equipos entrenados.\" },\n      { t:\"key\", text:\"Reconocer el límite salva vidas, incluida la tuya.\" } ] },\n    { title:\"Si la ayuda solo llega a los de siempre\", blocks:[\n      { t:\"p\", text:\"Búsquenlos a propósito: ancianos que viven solos, personas con discapacidad, hogares sin quién los defienda, los más pobres.\" },\n      { t:\"key\", text:\"La ayuda no fluye sola hacia ellos. Hay que ir a buscarlos.\" } ] } ] },\n\n  { id:\"porque\", num:\"6\", title:\"Por qué funciona\", sub:\"El respaldo de otros terremotos, en corto.\", lessons:[\n    { title:\"Nada de esto es improvisado\", blocks:[\n      { t:\"p\", text:\"Los desastres cambian rápido y por su cuenta. La respuesta rígida de «yo ordeno, ustedes obedecen» falla, y la comunidad que se organiza sola, con un poco de estructura, resiste mejor.\" },\n      { t:\"quote\", text:\"La gente común llega primero a la emergencia y se queda mucho después de que los servicios oficiales se van.\", src:\"Whittaker, McLennan y Handmer (2015) · México 1985\" } ] },\n    { title:\"Estructura mínima, no mando\", blocks:[\n      { t:\"p\", text:\"Darle a la autoorganización una estructura mínima rinde más que intentar mandarla desde arriba (Simsa et al., 2019).\" },\n      { t:\"p\", text:\"Un punto que conecta a los grupos sin absorberlos coordina sin apagar la iniciativa de nadie. Así funcionó la Red de Voluntarios de Nishinomiya tras el terremoto de Kobe en 1995.\" } ] },\n    { title:\"La información y la equidad\", blocks:[\n      { t:\"p\", text:\"Ponerle fecha y hora a cada dato mantiene la información útil, porque las necesidades cambian cada pocas horas. Lo aprendió #Verificado19S en México 2017.\" },\n      { t:\"p\", text:\"Y sin cuidado deliberado, la ayuda se queda en los más conectados. Pasó en Haití 2010 y en Tamil Nadu 2004.\" },\n      { t:\"key\", text:\"Registrar, conectar y cuidar la equidad no son adornos. Son lo que hace que esto funcione.\" } ] } ] }\n];\n\nclass Component extends DCLogic {\n  state = { modules: MODULES, view: \"home\", mi: 0, li: 0,\n            store: { done: {}, badges: [], streak: 1, last: null } };\n\n  componentDidMount() {\n    let store = null;\n    try { store = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) { store = null; }\n    if (!store || typeof store !== \"object\") store = { done: {}, badges: [], streak: 1, last: null };\n    store.done = store.done || {}; store.badges = store.badges || [];\n    const today = new Date().toISOString().slice(0, 10);\n    if (store.last !== today) {\n      const yest = new Date(Date.now() - 864e5).toISOString().slice(0, 10);\n      store.streak = (store.last === yest) ? (store.streak || 0) + 1 : 1;\n      store.last = today;\n    }\n    this.setState({ store });\n    localStorage.setItem(STORE_KEY, JSON.stringify(store));\n  }\n\n  getTheme() {\n    const d = String(this.props.direccion || \"Cívico\").toLowerCase();\n    let t = THEMES.civico;\n    if (d.indexOf(\"noct\") === 0) t = THEMES.nocturno;\n    if (d.indexOf(\"cor\") === 0) t = THEMES.coral;\n    if (d.indexOf(\"bos\") === 0) t = THEMES.bosque;\n    if (d.indexOf(\"mono\") === 0) t = THEMES.mono;\n    const m = { ter: t.accent, och: t.warn, terSoft: t.accentSoft, ochSoft: t.accentSoft, ...ORGANIC, ...t };\n    m.grainImg = m.grain === false ? \"none\" : GRAIN;\n    return m;\n  }\n\n  save(store) { this.setState({ store }); localStorage.setItem(STORE_KEY, JSON.stringify(store)); }\n\n  doneCount(m) {\n    const d = this.state.store.done[m.id] || {};\n    return m.lessons.reduce((a, _, i) => a + (d[i] ? 1 : 0), 0);\n  }\n\n  open(i) {\n    const m = this.state.modules[i];\n    const d = this.state.store.done[m.id] || {};\n    let li = m.lessons.findIndex((_, j) => !d[j]);\n    if (li < 0) li = 0;\n    this.setState({ view: \"module\", mi: i, li });\n    window.scrollTo(0, 0);\n  }\n\n  continueTarget() {\n    const ms = this.state.modules;\n    for (let i = 0; i < ms.length; i++) {\n      const d = this.state.store.done[ms[i].id] || {};\n      if (ms[i].lessons.some((_, j) => !d[j])) return i;\n    }\n    return -1;\n  }\n\n  next() {\n    const { modules, mi, li } = this.state;\n    const m = modules[mi];\n    const store = JSON.parse(JSON.stringify(this.state.store));\n    store.done[m.id] = store.done[m.id] || {};\n    store.done[m.id][li] = true;\n    if (li < m.lessons.length - 1) {\n      this.save(store);\n      this.setState({ li: li + 1 });\n    } else {\n      let fresh = false;\n      if (store.badges.indexOf(m.id) < 0) { store.badges.push(m.id); fresh = true; }\n      this.save(store);\n      this.setState({ view: fresh ? \"badge\" : \"home\" });\n    }\n    window.scrollTo(0, 0);\n  }\n\n  prev() { if (this.state.li > 0) { this.setState({ li: this.state.li - 1 }); window.scrollTo(0, 0); } }\n  back() { this.setState({ view: \"home\" }); window.scrollTo(0, 0); }\n\n  reset() {\n    if (window.confirm(\"¿Borrar todo tu progreso y tus insignias?\")) {\n      this.save({ done: {}, badges: [], streak: 1, last: new Date().toISOString().slice(0, 10) });\n      this.setState({ view: \"home\" });\n    }\n  }\n\n  renderVals() {\n    const t = this.getTheme();\n    const showGami = this.props.gamificacion ?? true;\n    const { modules, view, mi, li, store } = this.state;\n\n    const base = {\n      t, showGami,\n      isHome: view === \"home\", isModule: view === \"module\", isBadge: view === \"badge\",\n      onBack: () => this.back(), onNext: () => this.next(), onPrev: () => this.prev(),\n      onReset: () => this.reset(),\n      onContinue: () => { const i = this.continueTarget(); this.open(i >= 0 ? i : 0); },\n      streakTxt: store.streak + (store.streak === 1 ? \" día\" : \" días\")\n    };\n\n    const total = modules.reduce((a, m) => a + m.lessons.length, 0);\n    const done = modules.reduce((a, m) => a + this.doneCount(m), 0);\n    const pct = total ? done / total : 0;\n\n    const moduleCards = modules.map((m, i) => {\n      const dc = this.doneCount(m);\n      const isDone = dc === m.lessons.length;\n      return {\n        title: m.title, sub: m.sub,\n        med: isDone ? \"✓\" : m.num,\n        medBg: isDone ? t.accent : t.accentSoft,\n        medInk: isDone ? t.onAccent : t.accent,\n        pctW: Math.round(100 * dc / m.lessons.length) + \"%\",\n        counter: dc + \"/\" + m.lessons.length,\n        delay: (i * 45) + \"ms\",\n        open: () => this.open(i)\n      };\n    });\n\n    const badgeRow = modules.map((m) => {\n      const e = store.badges.indexOf(m.id) >= 0;\n      return { num: m.num, bg: e ? t.accent : \"transparent\", ink: e ? t.onAccent : t.mut,\n               bd: e ? t.accent : t.line, bs: e ? \"solid\" : \"dashed\" };\n    });\n\n    const cur = modules[mi];\n    const lesson = cur.lessons[li];\n    const blocks = lesson.blocks.map(b => ({\n      isP: b.t === \"p\", isKey: b.t === \"key\", isQuote: b.t === \"quote\", isList: b.t === \"list\",\n      text: b.text, src: b.src, items: b.items\n    }));\n    const segs = cur.lessons.map((_, j) => ({ bg: j <= li ? t.accent : t.line }));\n    const remaining = this.continueTarget();\n\n    return {\n      ...base,\n      doneTxt: done + \" de \" + total + \" lecciones completadas\",\n      pctTxt: Math.round(pct * 100) + \"%\",\n      ringOffset: RING_C * (1 - pct),\n      ctaLabel: done === 0 ? \"Empezar el manual\" : (remaining >= 0 ? \"Continuar donde quedaste\" : \"Repasar el manual\"),\n      moduleCards, badgeRow,\n      modLabel: \"MÓDULO \" + cur.num + \" · \" + cur.title.toUpperCase(),\n      lessonTitle: lesson.title, blocks, segs,\n      counterTxt: (li + 1) + \" / \" + cur.lessons.length,\n      nextLabel: li === cur.lessons.length - 1 ? \"Completar módulo\" : \"Siguiente\",\n      prevOpacity: li === 0 ? 0.35 : 1,\n      badgeNum: cur.num, badgeTitle: cur.title,\n      badgeSub: \"Completaste las \" + cur.lessons.length + \" lecciones del módulo \" + cur.num + \".\"\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>

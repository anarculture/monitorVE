  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n  font-display: swap;\n  src: url(\"65561b33-c665-489f-b934-b5ede5f8ae9d\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Schibsted Grotesk';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"a698b638-f2c8-48c6-861f-c05d9a360f2a\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Schibsted Grotesk';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"65561b33-c665-489f-b934-b5ede5f8ae9d\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  body{margin:0}\n  @keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}\n  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}\n  button{-webkit-tap-highlight-color:transparent}\n<\u002Fstyle>\n<script src=\"233553c6-75f7-44ca-aa71-bd13b8c37766\"><\u002Fscript>\n<\u002Fhelmet>\n\n<div data-screen-label=\"App\" style=\"min-height:100vh; background:{{ t.bg }}; color:{{ t.ink }}; font-family:'Instrument Sans',system-ui,sans-serif;\">\n<div style=\"max-width:480px; margin:0 auto; padding:0 20px;\">\n\n  <!-- ================= HOME ================= -->\n  <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n  <div data-screen-label=\"Inicio\" style=\"padding-bottom:48px; animation:fadeUp .35s ease both;\">\n\n    <div style=\"display:flex; justify-content:space-between; align-items:center; gap:12px; padding:26px 0 2px;\">\n      <div style=\"display:flex; align-items:center; gap:11px;\">\n        <svg width=\"38\" height=\"38\" viewBox=\"0 0 38 38\" style=\"flex:none;\">\n          <rect width=\"38\" height=\"38\" rx=\"12\" fill=\"{{ t.accent }}\"><\u002Frect>\n          <rect x=\"8\" y=\"25\" width=\"22\" height=\"4\" rx=\"2\" fill=\"{{ t.onAccent }}\"><\u002Frect>\n          <rect x=\"11.5\" y=\"19\" width=\"15\" height=\"4\" rx=\"2\" fill=\"{{ t.onAccent }}\" opacity=\"0.75\"><\u002Frect>\n          <rect x=\"15\" y=\"13\" width=\"8\" height=\"4\" rx=\"2\" fill=\"{{ t.onAccent }}\" opacity=\"0.5\"><\u002Frect>\n        <\u002Fsvg>\n        <div>\n          <div style=\"font-family:'Schibsted Grotesk',sans-serif; font-size:18px; font-weight:800; letter-spacing:-.01em; line-height:1.1;\">Tierra Firme<\u002Fdiv>\n          <div style=\"font-size:9.5px; font-weight:700; letter-spacing:.17em; color:{{ t.mut }}; margin-top:2px;\">RESPUESTA CIVIL · YARACUY<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ showGami }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex; align-items:center; gap:7px; background:{{ t.surface }}; border:1px solid {{ t.line }}; border-radius:999px; padding:8px 14px 8px 11px;\">\n          <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"{{ t.warn }}\"><path d=\"M12 2c.6 3.2-.8 5-2.4 6.6C8 10.2 6.5 12 6.5 15a5.5 5.5 0 0 0 11 0c0-1.8-.7-3.2-1.6-4.4-.5 1-1.2 1.8-2.2 2.2.4-2.9-.3-7.6-1.7-10.8Z\"><\u002Fpath><\u002Fsvg>\n          <span style=\"font-size:13.5px; font-weight:700;\">{{ streakTxt }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <h1 style=\"font-family:'Schibsted Grotesk',sans-serif; font-weight:800; font-size:30px; line-height:1.12; letter-spacing:-.015em; margin:10px 0 8px;\">Escuela de voluntariado<\u002Fh1>\n    <p style=\"font-size:16px; line-height:1.55; color:{{ t.mut }}; margin:0 0 22px;\">Aprende a organizar la respuesta de tu comunidad tras un desastre — basado en evidencia sobre sistemas adaptativos complejos y voluntariado espontáneo.<\u002Fp>\n\n    <div style=\"background:{{ t.surface }}; border:1px solid {{ t.line }}; border-radius:{{ t.r }}; padding:20px; margin-bottom:26px; display:flex; flex-direction:column; gap:16px;\">\n      <div style=\"display:flex; align-items:center; gap:16px;\">\n        <div style=\"position:relative; flex:none; width:64px; height:64px;\">\n          <svg width=\"64\" height=\"64\" viewBox=\"0 0 64 64\" style=\"display:block;\">\n            <circle cx=\"32\" cy=\"32\" r=\"26\" fill=\"none\" stroke=\"{{ t.line }}\" stroke-width=\"7\"><\u002Fcircle>\n            <circle cx=\"32\" cy=\"32\" r=\"26\" fill=\"none\" stroke=\"{{ t.accent }}\" stroke-width=\"7\" stroke-linecap=\"round\" stroke-dasharray=\"163.4\" stroke-dashoffset=\"{{ ringOffset }}\" transform=\"rotate(-90 32 32)\"><\u002Fcircle>\n          <\u002Fsvg>\n          <div style=\"position:absolute; inset:0; display:grid; place-items:center; font-size:13.5px; font-weight:700; color:{{ t.ink }};\">{{ pctTxt }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family:'Schibsted Grotesk',sans-serif; font-size:17px; font-weight:700; margin-bottom:3px;\">Tu progreso<\u002Fdiv>\n          <div style=\"font-size:14px; color:{{ t.mut }};\">{{ doneTxt }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <button onclick=\"{{ onContinue }}\" style=\"height:52px; border:0; border-radius:999px; background:{{ t.accent }}; color:{{ t.onAccent }}; font-family:'Instrument Sans',sans-serif; font-size:16px; font-weight:700; cursor:pointer; width:100%;\" style-hover=\"filter:brightness(1.07)\" style-active=\"transform:scale(.985)\">{{ ctaLabel }}<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div style=\"font-family:'Schibsted Grotesk',sans-serif; font-size:19px; font-weight:700; margin:0 0 12px;\">Módulos<\u002Fdiv>\n    <div style=\"display:flex; flex-direction:column; gap:10px;\">\n      <sc-for list=\"{{ moduleCards }}\" as=\"m\" hint-placeholder-count=\"7\">\n        <div onclick=\"{{ m.open }}\" role=\"button\" tabindex=\"0\" style=\"display:flex; align-items:center; gap:14px; background:{{ t.surface }}; border:1px solid {{ t.line }}; border-radius:{{ t.r }}; padding:14px 16px; cursor:pointer; min-height:56px;\" style-hover=\"border-color:{{ t.accent }}\" style-active=\"transform:scale(.99)\">\n          <div style=\"flex:none; width:44px; height:44px; border-radius:14px; background:{{ m.medBg }}; color:{{ m.medInk }}; display:grid; place-items:center; font-family:'Schibsted Grotesk',sans-serif; font-size:15px; font-weight:800;\">{{ m.med }}<\u002Fdiv>\n          <div style=\"flex:1; min-width:0;\">\n            <div style=\"font-size:16px; font-weight:600; line-height:1.3; margin-bottom:2px;\">{{ m.title }}<\u002Fdiv>\n            <div style=\"font-size:13px; color:{{ t.mut }}; line-height:1.4; margin-bottom:8px;\">{{ m.sub }}<\u002Fdiv>\n            <div style=\"height:4px; border-radius:2px; background:{{ t.line }}; overflow:hidden;\"><div style=\"height:100%; width:{{ m.pctW }}; background:{{ t.accent }}; border-radius:2px;\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:none; font-size:13px; font-weight:600; color:{{ t.mut }};\">{{ m.counter }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ showGami }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"font-family:'Schibsted Grotesk',sans-serif; font-size:19px; font-weight:700; margin:30px 0 12px;\">Insignias<\u002Fdiv>\n      <div style=\"display:flex; flex-wrap:wrap; gap:10px;\">\n        <sc-for list=\"{{ badgeRow }}\" as=\"b\" hint-placeholder-count=\"7\">\n          <div style=\"width:46px; height:46px; border-radius:50%; background:{{ b.bg }}; border:2px {{ b.bs }} {{ b.bd }}; color:{{ b.ink }}; display:grid; place-items:center; font-family:'Schibsted Grotesk',sans-serif; font-size:14px; font-weight:800;\">{{ b.num }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"display:flex; justify-content:center; margin-top:36px;\">\n      <button onclick=\"{{ onReset }}\" style=\"background:none; border:0; color:{{ t.mut }}; font-family:'Instrument Sans',sans-serif; font-size:13px; text-decoration:underline; cursor:pointer; padding:10px;\">Reiniciar progreso<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ================= LECCIÓN ================= -->\n  <sc-if value=\"{{ isModule }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"Lección\" style=\"display:flex; flex-direction:column; min-height:100vh;\">\n\n    <div style=\"position:sticky; top:0; z-index:5; background:{{ t.bg }}; padding:14px 0 12px; display:flex; align-items:center; gap:14px;\">\n      <button onclick=\"{{ onBack }}\" aria-label=\"Volver\" style=\"flex:none; width:44px; height:44px; border-radius:50%; border:1px solid {{ t.line }}; background:{{ t.surface }}; color:{{ t.ink }}; cursor:pointer; display:grid; place-items:center;\" style-hover=\"border-color:{{ t.accent }}\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 18l-6-6 6-6\"><\u002Fpath><\u002Fsvg>\n      <\u002Fbutton>\n      <div style=\"flex:1; display:flex; gap:5px;\">\n        <sc-for list=\"{{ segs }}\" as=\"s\" hint-placeholder-count=\"4\">\n          <div style=\"flex:1; height:5px; border-radius:3px; background:{{ s.bg }};\"><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"flex:none; font-size:13px; font-weight:600; color:{{ t.mut }};\">{{ counterTxt }}<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"flex:1; padding:10px 0 8px; animation:fadeUp .3s ease both;\">\n      <div style=\"font-size:11px; font-weight:700; letter-spacing:.14em; color:{{ t.accent }}; margin-bottom:8px;\">{{ modLabel }}<\u002Fdiv>\n      <h2 style=\"font-family:'Schibsted Grotesk',sans-serif; font-weight:800; font-size:25px; line-height:1.15; letter-spacing:-.012em; margin:0 0 18px;\">{{ lessonTitle }}<\u002Fh2>\n\n      <sc-for list=\"{{ blocks }}\" as=\"b\" hint-placeholder-count=\"3\">\n        <div>\n          <sc-if value=\"{{ b.isP }}\" hint-placeholder-val=\"{{ true }}\">\n            <p style=\"font-size:16.5px; line-height:1.62; margin:0 0 16px;\">{{ b.text }}<\u002Fp>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ b.isKey }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:{{ t.accentSoft }}; border-radius:16px; padding:16px 18px; margin:0 0 16px;\">\n              <div style=\"font-size:11px; font-weight:700; letter-spacing:.14em; color:{{ t.accent }}; margin-bottom:6px;\">CLAVE<\u002Fdiv>\n              <div style=\"font-size:16.5px; font-weight:600; line-height:1.5;\">{{ b.text }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ b.isQuote }}\" hint-placeholder-val=\"{{ false }}\">\n            <figure style=\"margin:0 0 16px; border-left:3px solid {{ t.accent }}; padding:4px 0 4px 16px;\">\n              <blockquote style=\"margin:0; font-size:16.5px; font-style:italic; line-height:1.55;\">{{ b.text }}<\u002Fblockquote>\n              <figcaption style=\"margin-top:8px; font-size:13px; font-weight:600; color:{{ t.mut }};\">{{ b.src }}<\u002Ffigcaption>\n            <\u002Ffigure>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ b.isList }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex; flex-direction:column; gap:11px; margin:2px 0 18px;\">\n              <sc-for list=\"{{ b.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex; gap:12px; align-items:flex-start;\">\n                  <div style=\"flex:none; width:8px; height:8px; border-radius:50%; background:{{ t.accent }}; margin-top:8px;\"><\u002Fdiv>\n                  <div style=\"font-size:16px; line-height:1.55;\">{{ it }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"position:sticky; bottom:0; padding:14px 0 24px; background:linear-gradient(to top, {{ t.bg }} 72%, transparent);\">\n      <div style=\"display:flex; gap:10px;\">\n        <button onclick=\"{{ onPrev }}\" style=\"flex:none; height:52px; padding:0 22px; border-radius:999px; border:1px solid {{ t.line }}; background:{{ t.surface }}; color:{{ t.ink }}; font-family:'Instrument Sans',sans-serif; font-size:15px; font-weight:600; cursor:pointer; opacity:{{ prevOpacity }};\">Anterior<\u002Fbutton>\n        <button onclick=\"{{ onNext }}\" style=\"flex:1; height:52px; border-radius:999px; border:0; background:{{ t.accent }}; color:{{ t.onAccent }}; font-family:'Instrument Sans',sans-serif; font-size:16px; font-weight:700; cursor:pointer;\" style-hover=\"filter:brightness(1.07)\" style-active=\"transform:scale(.985)\">{{ nextLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ================= INSIGNIA ================= -->\n  <sc-if value=\"{{ isBadge }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"Insignia\" style=\"min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 8px; gap:6px;\">\n    <div style=\"position:relative; width:150px; height:150px; animation:pop .5s cubic-bezier(.2,1.4,.4,1) both;\">\n      <svg width=\"150\" height=\"150\" viewBox=\"0 0 150 150\" style=\"display:block;\">\n        <circle cx=\"75\" cy=\"75\" r=\"70\" fill=\"{{ t.accentSoft }}\"><\u002Fcircle>\n        <circle cx=\"75\" cy=\"75\" r=\"54\" fill=\"{{ t.accent }}\"><\u002Fcircle>\n        <circle cx=\"75\" cy=\"75\" r=\"61\" fill=\"none\" stroke=\"{{ t.accent }}\" stroke-width=\"2\" stroke-dasharray=\"4 7\" stroke-linecap=\"round\"><\u002Fcircle>\n      <\u002Fsvg>\n      <div style=\"position:absolute; inset:0; display:grid; place-items:center; font-family:'Schibsted Grotesk',sans-serif; font-size:40px; font-weight:800; color:{{ t.onAccent }};\">{{ badgeNum }}<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size:11px; font-weight:700; letter-spacing:.16em; color:{{ t.accent }}; margin-top:22px;\">INSIGNIA TIERRA FIRME<\u002Fdiv>\n    <h2 style=\"font-family:'Schibsted Grotesk',sans-serif; font-weight:800; font-size:26px; letter-spacing:-.012em; margin:4px 0 2px;\">{{ badgeTitle }}<\u002Fh2>\n    <p style=\"font-size:15.5px; color:{{ t.mut }}; margin:0 0 26px; max-width:30em;\">{{ badgeSub }}<\u002Fp>\n    <button onclick=\"{{ onBack }}\" style=\"height:52px; padding:0 34px; border-radius:999px; border:0; background:{{ t.accent }}; color:{{ t.onAccent }}; font-family:'Instrument Sans',sans-serif; font-size:16px; font-weight:700; cursor:pointer;\" style-hover=\"filter:brightness(1.07)\">Seguir aprendiendo<\u002Fbutton>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;: {&quot;width&quot;: 430, &quot;height&quot;: 900}, &quot;direccion&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;Cívico&quot;, &quot;Nocturno&quot;, &quot;Coral&quot;], &quot;default&quot;: &quot;Cívico&quot;, &quot;section&quot;: &quot;Apariencia&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;gamificacion&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;section&quot;: &quot;Apariencia&quot;, &quot;tsType&quot;: &quot;boolean&quot;}}\">\nconst STORE_KEY = \"yaracuy-aprende-v1\";\nconst RING_C = 163.4;\n\nconst THEMES = {\n  civico:   { bg:\"#F2F1EB\", surface:\"#FFFFFF\", ink:\"#191C18\", mut:\"#656C63\", line:\"#E1E0D5\", accent:\"#0E7C5B\", onAccent:\"#FFFFFF\", accentSoft:\"#E2EFE8\", warn:\"#DA9A28\", r:\"20px\" },\n  nocturno: { bg:\"#0F1417\", surface:\"#1A2126\", ink:\"#EDF2F1\", mut:\"#8FA09E\", line:\"#28323A\", accent:\"#FFC94A\", onAccent:\"#241A00\", accentSoft:\"#2C2A1D\", warn:\"#4CC38A\", r:\"20px\" },\n  coral:    { bg:\"#FBF6F0\", surface:\"#FFFFFF\", ink:\"#221712\", mut:\"#7C6A5F\", line:\"#EBDFD3\", accent:\"#D9502A\", onAccent:\"#FFFFFF\", accentSoft:\"#F8E3D8\", warn:\"#2B5B63\", r:\"20px\" }\n};\n\nclass Component extends DCLogic {\n  state = { modules: null, view: \"home\", mi: 0, li: 0,\n            store: { done: {}, badges: [], streak: 1, last: null } };\n\n  componentDidMount() {\n    const tryLoad = () => {\n      if (window.TF_MODULES) this.setState({ modules: window.TF_MODULES });\n      else setTimeout(tryLoad, 60);\n    };\n    tryLoad();\n    let store = null;\n    try { store = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) { store = null; }\n    if (!store || typeof store !== \"object\") store = { done: {}, badges: [], streak: 1, last: null };\n    store.done = store.done || {}; store.badges = store.badges || [];\n    const today = new Date().toISOString().slice(0, 10);\n    if (store.last !== today) {\n      const yest = new Date(Date.now() - 864e5).toISOString().slice(0, 10);\n      store.streak = (store.last === yest) ? (store.streak || 0) + 1 : 1;\n      store.last = today;\n    }\n    this.setState({ store });\n    localStorage.setItem(STORE_KEY, JSON.stringify(store));\n  }\n\n  getTheme() {\n    const d = String(this.props.direccion || \"Cívico\").toLowerCase();\n    if (d.indexOf(\"noct\") === 0) return THEMES.nocturno;\n    if (d.indexOf(\"cor\") === 0) return THEMES.coral;\n    return THEMES.civico;\n  }\n\n  save(store) { this.setState({ store }); localStorage.setItem(STORE_KEY, JSON.stringify(store)); }\n\n  doneCount(m) {\n    const d = this.state.store.done[m.id] || {};\n    return m.lessons.reduce((a, _, i) => a + (d[i] ? 1 : 0), 0);\n  }\n\n  open(i) {\n    const m = this.state.modules[i];\n    const d = this.state.store.done[m.id] || {};\n    let li = m.lessons.findIndex((_, j) => !d[j]);\n    if (li < 0) li = 0;\n    this.setState({ view: \"module\", mi: i, li });\n    window.scrollTo(0, 0);\n  }\n\n  continueTarget() {\n    const ms = this.state.modules;\n    for (let i = 0; i < ms.length; i++) {\n      const d = this.state.store.done[ms[i].id] || {};\n      if (ms[i].lessons.some((_, j) => !d[j])) return i;\n    }\n    return -1;\n  }\n\n  next() {\n    const { modules, mi, li } = this.state;\n    const m = modules[mi];\n    const store = JSON.parse(JSON.stringify(this.state.store));\n    store.done[m.id] = store.done[m.id] || {};\n    store.done[m.id][li] = true;\n    if (li < m.lessons.length - 1) {\n      this.save(store);\n      this.setState({ li: li + 1 });\n    } else {\n      let fresh = false;\n      if (store.badges.indexOf(m.id) < 0) { store.badges.push(m.id); fresh = true; }\n      this.save(store);\n      this.setState({ view: fresh ? \"badge\" : \"home\" });\n    }\n    window.scrollTo(0, 0);\n  }\n\n  prev() { if (this.state.li > 0) { this.setState({ li: this.state.li - 1 }); window.scrollTo(0, 0); } }\n  back() { this.setState({ view: \"home\" }); window.scrollTo(0, 0); }\n\n  reset() {\n    if (window.confirm(\"¿Borrar todo tu progreso y tus insignias?\")) {\n      this.save({ done: {}, badges: [], streak: 1, last: new Date().toISOString().slice(0, 10) });\n      this.setState({ view: \"home\" });\n    }\n  }\n\n  renderVals() {\n    const t = this.getTheme();\n    const showGami = this.props.gamificacion ?? true;\n    const { modules, view, mi, li, store } = this.state;\n\n    const base = {\n      t, showGami,\n      isHome: view === \"home\", isModule: view === \"module\", isBadge: view === \"badge\",\n      onBack: () => this.back(), onNext: () => this.next(), onPrev: () => this.prev(),\n      onReset: () => this.reset(),\n      onContinue: () => { const i = this.continueTarget(); this.open(i >= 0 ? i : 0); },\n      streakTxt: store.streak + (store.streak === 1 ? \" día\" : \" días\")\n    };\n\n    if (!modules) {\n      return { ...base, pctTxt: \"\", ringOffset: RING_C, doneTxt: \"Cargando el curso…\", ctaLabel: \"Empezar el curso\", prevOpacity: 1 };\n    }\n\n    const total = modules.reduce((a, m) => a + m.lessons.length, 0);\n    const done = modules.reduce((a, m) => a + this.doneCount(m), 0);\n    const pct = total ? done / total : 0;\n\n    const moduleCards = modules.map((m, i) => {\n      const dc = this.doneCount(m);\n      const isDone = dc === m.lessons.length;\n      return {\n        title: m.title, sub: m.sub,\n        med: isDone ? \"✓\" : m.num,\n        medBg: isDone ? t.accent : t.accentSoft,\n        medInk: isDone ? t.onAccent : t.accent,\n        pctW: Math.round(100 * dc / m.lessons.length) + \"%\",\n        counter: dc + \"/\" + m.lessons.length,\n        open: () => this.open(i)\n      };\n    });\n\n    const badgeRow = modules.map(m => {\n      const e = store.badges.indexOf(m.id) >= 0;\n      return { num: m.num, bg: e ? t.accent : \"transparent\", ink: e ? t.onAccent : t.mut,\n               bd: e ? t.accent : t.line, bs: e ? \"solid\" : \"dashed\" };\n    });\n\n    const cur = modules[mi];\n    const lesson = cur.lessons[li];\n    const blocks = lesson.blocks.map(b => ({\n      isP: b.t === \"p\", isKey: b.t === \"key\", isQuote: b.t === \"quote\", isList: b.t === \"list\",\n      text: b.text, src: b.src, items: b.items\n    }));\n    const segs = cur.lessons.map((_, j) => ({ bg: j <= li ? t.accent : t.line }));\n    const remaining = this.continueTarget();\n\n    return {\n      ...base,\n      doneTxt: done + \" de \" + total + \" lecciones completadas\",\n      pctTxt: Math.round(pct * 100) + \"%\",\n      ringOffset: RING_C * (1 - pct),\n      ctaLabel: done === 0 ? \"Empezar el curso\" : (remaining >= 0 ? \"Continuar donde quedaste\" : \"Repasar el curso\"),\n      moduleCards, badgeRow,\n      modLabel: \"MÓDULO \" + cur.num + \" · \" + cur.title.toUpperCase(),\n      lessonTitle: lesson.title, blocks, segs,\n      counterTxt: (li + 1) + \" / \" + cur.lessons.length,\n      nextLabel: li === cur.lessons.length - 1 ? \"Completar módulo\" : \"Siguiente\",\n      prevOpacity: li === 0 ? 0.35 : 1,\n      badgeNum: cur.num, badgeTitle: cur.title,\n      badgeSub: \"Completaste las \" + cur.lessons.length + \" lecciones del módulo \" + cur.num + \".\"\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
